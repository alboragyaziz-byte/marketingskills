<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة سجى السعيدة</title>
<style>
body{font-family:Arial,Tahoma,sans-serif;text-align:center;background:linear-gradient(160deg,#fff3f8,#e0f7ff,#fff7d6);margin:0;padding:20px;min-height:100vh;color:#3b2f4a}h1{color:#e91e63;font-size:42px}.card{background:rgba(255,255,255,.9);border-radius:28px;padding:20px;max-width:850px;margin:auto;box-shadow:0 12px 25px rgba(0,0,0,.12)}.btn{border:0;border-radius:22px;padding:18px 28px;font-size:28px;font-weight:bold;color:white;background:linear-gradient(135deg,#ff6fb1,#8b5cf6);box-shadow:0 8px 0 #6d28d9;cursor:pointer}.mode{font-size:24px;border:0;border-radius:24px;background:white;padding:22px;margin:8px;box-shadow:0 8px 18px #ddd;min-width:145px}.animals{display:flex;justify-content:center;flex-wrap:wrap;gap:15px;margin-top:20px}.animal{font-size:70px;border:0;border-radius:24px;background:white;padding:18px;min-width:130px;box-shadow:0 8px 0 #f9a8d4;cursor:pointer}.name{font-size:20px;color:#7c3aed;font-weight:bold}.q{font-size:34px;font-weight:bold;margin:20px}.result{font-size:32px;font-weight:bold;min-height:50px}.badge{display:inline-block;background:white;border-radius:20px;padding:10px 14px;margin:6px;font-size:22px;font-weight:bold}.hide{display:none}
</style>
</head>
<body>
<div id="home" class="card">
<h1>🌸 لعبة سجى السعيدة 🌸</h1>
<p style="font-size:26px">مرحباً يا سجى 💖<br>اختاري لعبة وابدئي المرح!</p>
<button class="mode" onclick="start('animals')">🐰<br>الحيوانات</button>
<button class="mode" onclick="start('colors')">🎨<br>الألوان</button>
<button class="mode" onclick="start('fruits')">🍎<br>الفواكه</button>
<button class="mode" onclick="start('numbers')">🔢<br>الأرقام</button><br><br>
<button class="btn" onclick="start('animals')">ابدئي اللعب ✨</button>
</div>
<div id="game" class="card hide">
<h1 id="title">لعبة سجى</h1>
<div><span class="badge">⭐ النقاط: <b id="score">0</b></span><span class="badge">🎯 الجولة: <b id="round">1</b></span></div>
<div id="q" class="q"></div>
<div id="choices" class="animals"></div>
<div id="r" class="result"></div>
<button class="btn" style="font-size:22px;margin-top:20px" onclick="home()">الرئيسية 🏠</button>
</div>
<script>
const data={animals:{title:'🐾 أين الحيوان؟',ask:'أين',items:[['🐰','الأرنب'],['🐱','القطة'],['🐘','الفيل'],['🦁','الأسد'],['🐵','القرد'],['🐼','الباندا']]},colors:{title:'🎨 اختاري اللون',ask:'أين اللون',items:[['🔴','الأحمر'],['🟡','الأصفر'],['🔵','الأزرق'],['🟢','الأخضر'],['🟣','البنفسجي'],['🟠','البرتقالي']]},fruits:{title:'🍓 أين الفاكهة؟',ask:'أين',items:[['🍎','التفاحة'],['🍌','الموزة'],['🍓','الفراولة'],['🍇','العنب'],['🍉','البطيخ'],['🍊','البرتقالة']]},numbers:{title:'🔢 لعبة العد',ask:'اختاري الرقم',items:[['1️⃣','واحد'],['2️⃣','اثنين'],['3️⃣','ثلاثة'],['4️⃣','أربعة'],['5️⃣','خمسة'],['6️⃣','ستة']]}};
let mode='animals',ans='',score=0,round=1;
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function start(m){mode=m;score=0;round=1;homeEl.classList.add('hide');gameEl.classList.remove('hide');title.textContent=data[mode].title;newRound()}
const homeEl=document.getElementById('home'),gameEl=document.getElementById('game'),title=document.getElementById('title');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function newRound(){document.getElementById('score').textContent=score;document.getElementById('round').textContent=round;let arr=shuffle(data[mode].items).slice(0,3);ans=arr[Math.floor(Math.random()*arr.length)][1];q.textContent=data[mode].ask+' '+ans+'؟';r.textContent='';choices.innerHTML='';arr.forEach(x=>{let b=document.createElement('button');b.className='animal';b.innerHTML=x[0]+'<div class="name">'+x[1]+'</div>';b.onclick=()=>choose(x[1]);choices.appendChild(b)});speak(data[mode].ask+' '+ans)}
function choose(n){if(n===ans){score++;r.style.color='#16a34a';r.textContent='⭐ أحسنتِ يا سجى ⭐';speak('أحسنت يا سجى');setTimeout(()=>{round++; if(round>10){r.textContent='🎉 ممتاز يا سجى، أنت بطلة 🎉'; speak('ممتاز يا سجى أنت بطلة')}else newRound()},900)}else{r.style.color='#f97316';r.textContent='😊 حاولي مرة أخرى يا سجى';speak('حاولي مرة أخرى يا سجى')}}
function home(){speechSynthesis.cancel();gameEl.classList.add('hide');homeEl.classList.remove('hide')}
</script>
</body>
</html>
